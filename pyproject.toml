[project]
name = "igctl"
version = "0.1.0"
description = "Command-line toolkit to publish, schedule, analyze and automate Instagram"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["instagram", "cli", "automation", "instagram-api", "graph-api", "instagrapi", "social-media", "scheduler", "analytics", "agent-skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Utilities",
]
authors = [
    { name = "muneebhashone", email = "themuneebh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "instagrapi>=3.0.21",
    "pillow>=10.0",
    "keyring>=25.0",
    "croniter>=2.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
    "moviepy>=2.2",
]

[project.urls]
Homepage = "https://github.com/muneebhashone/igctl"
Repository = "https://github.com/muneebhashone/igctl"
Issues = "https://github.com/muneebhashone/igctl/issues"

[project.scripts]
igctl = "igctl.cli.main:run"

[project.optional-dependencies]
s3 = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# moviepy pins pillow<12 out of caution; instagrapi 3 needs pillow 12 and moviepy works with it.
override-dependencies = ["pillow>=12.2,<13"]
