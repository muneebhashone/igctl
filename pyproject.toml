[project]
name = "igctl"
version = "0.1.0"
description = "Command-line toolkit to publish, analyze and automate Instagram"
readme = "README.md"
authors = [
    { name = "muneebhashone", email = "themuneebh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "instagrapi>=2.1",
    "pillow>=10.0",
    "keyring>=25.0",
    "croniter>=2.0",
]

[project.scripts]
igctl = "igctl.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
